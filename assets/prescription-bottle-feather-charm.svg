    <rect x="-132" y="-140" width="264" height="394" rx="46" fill="url(#glass)" stroke="#e9e5f2" stroke-opacity=".32" stroke-width="5"/>
    <rect x="-98" y="-52" width="196" height="166" rx="14" fill="#ebe7f3" fill-opacity=".82"/>
    <text x="0" y="26" text-anchor="middle" fill="#1b1822" font-size="76" font-family="serif" font-weight="700">Rx</text>
    <text x="0" y="74" text-anchor="middle" fill="#1b1822" font-size="22" font-family="serif" font-weight="700" letter-spacing="4">WHITE ROOM</text>
    <text x="0" y="136" text-anchor="middle" fill="#d8cfef" font-size="26" font-family="serif" letter-spacing="5">CONTROL</text>
