<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">処方箋ボトルと黒羽チャーム</title>
  <desc id="desc">薬瓶風ボトルと黒い羽根チャームの商品画像</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="28%" r="76%">
      <stop offset="0" stop-color="#35313f"/>
      <stop offset=".54" stop-color="#121219"/>
      <stop offset="1" stop-color="#050509"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f4f1ff" stop-opacity=".42"/>
      <stop offset=".5" stop-color="#8c879b" stop-opacity=".26"/>
      <stop offset="1" stop-color="#262332" stop-opacity=".72"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="18" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect x="42" y="42" width="716" height="916" rx="34" fill="none" stroke="#7d4aa1" stroke-width="2"/>
