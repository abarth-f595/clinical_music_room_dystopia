<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">臨床音楽室ポスターセット</title>
  <desc id="desc">三枚の楽曲ポスターを重ねた商品画像</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#221527"/>
      <stop offset=".45" stop-color="#09090d"/>
      <stop offset="1" stop-color="#201112"/>
    </linearGradient>
    <linearGradient id="p1" x1="0" x2="1">
      <stop offset="0" stop-color="#1b1023"/>
      <stop offset="1" stop-color="#523170"/>
    </linearGradient>
    <linearGradient id="p2" x1="0" x2="1">
      <stop offset="0" stop-color="#0c0c12"/>
      <stop offset="1" stop-color="#7b171a"/>
    </linearGradient>
    <linearGradient id="p3" x1="0" x2="1">
      <stop offset="0" stop-color="#1a1723"/>
      <stop offset="1" stop-color="#d2b06e"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="16" flood-color="#000" flood-opacity=".58"/>
    </filter>
