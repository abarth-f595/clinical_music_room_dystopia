  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect x="42" y="42" width="716" height="916" rx="34" fill="none" stroke="#c8a96a" stroke-opacity=".24" stroke-width="2"/>
  <g transform="translate(400 460)" filter="url(#shadow)">
