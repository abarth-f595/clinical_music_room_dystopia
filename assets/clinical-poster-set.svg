      <circle cx="0" cy="-154" r="58" fill="#d6c4ff" opacity=".58"/>
      <path d="M-72-38c72-86 142-86 144 0-44 44-100 44-144 0Z" fill="#08060c"/>
      <text x="0" y="58" text-anchor="middle" fill="#f3f0ea" font-size="23" font-family="serif">虚ろな扉</text>
    </g>
    <g transform="translate(0 0)">
      <rect x="-132" y="-286" width="264" height="396" rx="10" fill="url(#p2)" stroke="#9f4b32" stroke-width="4"/>
